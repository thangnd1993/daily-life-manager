name: daily-life-manager-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  migrate:
    build:
      context: ./apps/api
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: ['migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [backend]

  api:
    build:
      context: ./apps/api
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      GOLD_PROVIDER: ${GOLD_PROVIDER:-pha}
      GOLD_PROVIDER_BASE_URL: ${GOLD_PROVIDER_BASE_URL:-https://www.pha.vn/api/v1}
      GOLD_PROVIDER_API_KEY: ${GOLD_PROVIDER_API_KEY:-}
      GOLD_PROVIDER_TIMEOUT_MS: ${GOLD_PROVIDER_TIMEOUT_MS:-5000}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [backend, frontend]

  admin-web:
    build:
      context: ./apps/admin-web
      target: runtime
    ports:
      - '${ADMIN_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [frontend]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
  frontend:

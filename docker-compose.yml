name: daily-life-manager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daily_life_manager
      POSTGRES_USER: daily_life_manager
      POSTGRES_PASSWORD: local_development_only
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daily_life_manager -d daily_life_manager']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

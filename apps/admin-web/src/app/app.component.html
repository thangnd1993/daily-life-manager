<header class="topbar">
  <a class="brand" routerLink="/users"><span class="brand-mark">D</span>Daily Life Manager</a>

      <a routerLink="/users">Users</a>
      <button class="logout" type="button" (click)="logout()">Sign out</button>

  }
</header>
<main><router-outlet /></main>
